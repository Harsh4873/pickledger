name: External Feed Refresh

# Runs SportyTrader, SportsGambler, Forebet, and TennisTonic scrapers on a daily
# coordinator and publishes their results into data/model_cache so GitHub Pages
# can serve them without waiting on the cloud backend.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional target date (YYYY-MM-DD or MM/DD/YYYY)"
        required: false
        default: ""
      feeds:
        description: "Comma-separated GitHub-safe feeds (Scores24 is local-only)"
        required: false
        default: "sportytrader,sportsgambler,forebet_mls,forebet_mlb,forebet_wnba,tennistonic_tennis,forebet_cfb,forebet_nfl,forebet_nhl"

permissions:
  contents: write
  actions: write

concurrency:
  group: pick-cache-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PICKLEDGER_MLB_TIMEZONE: America/Chicago
      PICKLEDGER_PLAYWRIGHT_RUNTIME_INSTALL: true
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium chromium-headless-shell

      - name: Select GitHub-safe feeds
        id: feeds
        env:
          REQUESTED_FEEDS: ${{ github.event.inputs.feeds || 'sportytrader,sportsgambler,forebet_mls,forebet_mlb,forebet_wnba,tennistonic_tennis,forebet_cfb,forebet_nfl,forebet_nhl' }}
        run: |
          set -euo pipefail
          FEEDS=$(printf '%s' "$REQUESTED_FEEDS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ "$FEEDS" = "all" ] || [[ ",${FEEDS}," == *",scores24_"* ]]; then
            echo "::error::Scores24 feeds are local-only; run scripts/scrapers/scores24_publish.sh from a non-Actions IP."
            exit 1
          fi
          echo "value=${FEEDS}" >> "$GITHUB_OUTPUT"

      - name: Refresh external feeds
        id: refresh-feeds
        # Publish source outage diagnostics even when every provider fails.
        continue-on-error: true
        run: |
          python scripts/refresh_external_feeds.py \
            --date "${{ github.event.inputs.date || '' }}" \
            --feeds "${{ steps.feeds.outputs.value }}" \
            --sports "nba,mlb,wnba,cfb,nfl,nhl" \
            --skip-firestore

      - name: Report source coverage and feature freshness
        if: always()
        run: python scripts/source_health.py

      - name: Commit feed cache JSON if changed
        id: commit-feeds
        run: |
          ACTOR_EMAIL="${GITHUB_ACTOR_ID:-41898282}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${ACTOR_EMAIL}"
          # Always publish the canonical Pages branch, including manual runs.
          BRANCH="main"
          if [ -z "$(git status --porcelain -- data/model_cache)" ]; then
            echo "No change in data/model_cache — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GENERATED_CACHE="${RUNNER_TEMP}/external-feed-cache-latest.json"
          cp data/model_cache/latest.json "$GENERATED_CACHE"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/${BRANCH}"
            MERGE_RESULT=$(python scripts/merge_external_feed_cache_payload.py "$GENERATED_CACHE")
            echo "$MERGE_RESULT"
            DEPLOYABLE=$(python -c 'import json,sys; print(str(json.load(sys.stdin)["latestUpdated"]).lower())' <<< "$MERGE_RESULT")
            git add data/model_cache
            if git diff --cached --quiet; then
              echo "No staged feed cache change after merge — skipping commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "deployable=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CACHE_DATE=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["date"])' "$GENERATED_CACHE")
            if [ "$DEPLOYABLE" = "true" ]; then
              python scripts/build_parlay_cards.py --date "$CACHE_DATE"
              python scripts/build_profit_desk.py --date "$CACHE_DATE"
              git add data/parlay_cards data/profit_desk
            fi
            git commit -m "chore(feeds): refresh external feeds for ${CACHE_DATE}"
            if git push origin "HEAD:${BRANCH}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "deployable=${DEPLOYABLE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying merge on latest origin/${BRANCH}."
          done
          echo "Unable to publish external feed cache after retrying latest origin/${BRANCH}."
          exit 1

      - name: Deploy updated external feeds
        if: steps.commit-feeds.outputs.changed == 'true' && steps.commit-feeds.outputs.deployable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Notify Profit Desk
        # Pushes made with GITHUB_TOKEN never emit push events, so the
        # profit-desk-notify push trigger cannot fire on its own.
        if: steps.commit-feeds.outputs.changed == 'true' && steps.commit-feeds.outputs.deployable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run profit-desk-notify.yml --ref main

      - name: Report refresh failure after publishing diagnostics
        if: steps.refresh-feeds.outcome == 'failure'
        run: |
          echo "::error::External feed refresh failed. Published source diagnostics and retained the last successful picks."
          exit 1
