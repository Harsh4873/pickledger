name: Dev Checks

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'data/**'
      - 'player_props/artifacts/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          # Vite uses source/root assets; frontend tests mock cache requests.
          # Sparse checkout also enables checkout's blob:none fetch filter.
          sparse-checkout: |
            src
            tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend behavior
        run: npm test

      - name: Build frontend
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          # Tests build temporary training histories. Keep all JSON data for
          # the size guard, every cache fixture, and all fitted artifacts.
          sparse-checkout: |
            /*
            !/data/player_props_training/*.jsonl
            !/data/player_props_training/*.jsonl.gz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check committed data file sizes
        run: python scripts/check_data_file_sizes.py

      - name: Run smoke tests
        run: python -m pytest tests/smoke -v
