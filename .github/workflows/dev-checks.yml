name: Dev Checks

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'data/**'
      - 'player_props/artifacts/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          # Vite uses source/root assets; frontend tests mock cache requests.
          # Sparse checkout also enables checkout's blob:none fetch filter.
          sparse-checkout: |
            src
            tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend behavior
        run: npm test

      - name: Build frontend
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          # Audited smoke inputs: retain complete cache/snapshot fixture sets.
          # Tests construct training histories; fitted artifacts stay present.
          sparse-checkout: |
            /*
            !/data/
            /data/calibration/
            !/data/calibration/team_prop_pregame_ledger/
            /data/model_cache/
            /data/player_props_cache/
            /data/player_props_snapshots/
            /data/nfl/
            /data/wnba/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check committed data file sizes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Check omitted JSON against the index without hydrating its blobs.
          gh api "repos/${GH_REPO}/git/trees/$(git rev-parse HEAD)?recursive=1" > "${RUNNER_TEMP}/data-tree.json"
          python scripts/check_data_file_sizes.py --git-tree "${RUNNER_TEMP}/data-tree.json"

      - name: Run smoke tests
        env:
          PICKLEDGER_DATA_GIT_TREE: ${{ runner.temp }}/data-tree.json
        run: python -m pytest tests/smoke -v
