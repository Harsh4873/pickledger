name: Model Cache Refresh

on:
  workflow_call:
    inputs:
      skip_deploy:
        description: "Let the caller deploy after all refresh jobs succeed"
        type: boolean
        default: false
    outputs:
      published:
        description: "Whether this run committed model cache updates to main"
        value: ${{ jobs.refresh.outputs.published }}
  workflow_dispatch:
    inputs:
      date:
        description: "Optional target date (YYYY-MM-DD or MM/DD/YYYY)"
        required: false
        default: ""
      models:
        description: "Comma-separated models, or all"
        required: false
        default: "mlb_new,mlb_inning,mlb_first_five,mlb_team_total,wnba,nba,nba_playoffs,mls,nfl,cfb,nhl,tennis"

permissions:
  contents: write
  actions: write

concurrency:
  group: pick-cache-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      published: ${{ steps.commit-cache.outputs.changed }}
    env:
      PYTHONUNBUFFERED: "1"
      PICKLEDGER_MLB_TIMEZONE: America/Chicago
      PICKLEDGER_MLB_MODEL_TIMEOUT_SECONDS: 1200
      # Outer guard; the NBA transport bounds individual requests and retries.
      PICKLEDGER_NBA_MODEL_TIMEOUT_SECONDS: 900
      PICKLEDGER_MLB_INNING_TIMEOUT_SECONDS: 240
      PICKLEDGER_MLB_INNING_LOOKAHEAD_DAYS: 0
      PICKLEDGER_RUN_WNBA: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache completed tennis results
        uses: actions/cache@v4
        with:
          path: data/tennis/raw/espn_results
          key: ${{ runner.os }}-tennis-results-v1-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-tennis-results-v1-

      - name: Refresh model caches
        id: refresh-models
        continue-on-error: true
        run: |
          python scripts/refresh_model_cache.py \
            --date "${{ github.event.inputs.date || '' }}" \
            --models "${{ github.event.inputs.models || 'mlb_new,mlb_inning,mlb_first_five,mlb_team_total,wnba,nba,nba_playoffs,mls,nfl,cfb,nhl,tennis' }}" \
            --max-workers 3 \
            --skip-firestore

      - name: Preserve generated model cache
        if: ${{ !cancelled() && steps.refresh-models.outputs.cache_written == 'true' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: model-cache-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            data/model_cache/latest.json
            data/model_cache/${{ steps.refresh-models.outputs.cache_date }}.json
            data/calibration/team_prop_pregame_ledger.json

      - name: Rebuild parlay cards
        run: python scripts/build_parlay_cards.py --date "${{ github.event.inputs.date || '' }}"

      - name: Rebuild Profit Desk
        run: python scripts/build_profit_desk.py --date "${{ github.event.inputs.date || '' }}"

      - name: Report source coverage and feature freshness
        if: always()
        # This is a diagnostic report. The refresh and publication steps below
        # remain hard failures if their own contract is broken.
        id: source-health
        continue-on-error: true
        run: python scripts/source_health.py

      - name: Warn if source health reporting failed
        if: steps.source-health.outcome == 'failure'
        run: echo "::warning::Source health report failed; inspect its log. Model publication checks still apply."

      - name: Commit cache JSON if changed
        id: commit-cache
        if: ${{ !cancelled() && steps.refresh-models.outputs.publishable == 'true' }}
        run: |
          ACTOR_EMAIL="${GITHUB_ACTOR_ID:-41898282}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${ACTOR_EMAIL}"
          # Always publish the canonical Pages branch, including manual runs.
          BRANCH="main"
          if [ -z "$(git status --porcelain -- data/model_cache data/parlay_cards data/profit_desk data/calibration/team_prop_pregame_ledger.json)" ]; then
            echo "No model-cache, parlay-card, Profit Desk, or team-prop ledger change — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GENERATED_CACHE="${RUNNER_TEMP}/model-cache-latest.json"
          GENERATED_TEAM_LEDGER="${RUNNER_TEMP}/team-prop-pregame-ledger.json"
          cp data/model_cache/latest.json "$GENERATED_CACHE"
          cp data/calibration/team_prop_pregame_ledger.json "$GENERATED_TEAM_LEDGER"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/${BRANCH}"
            python scripts/merge_model_cache_payload.py "$GENERATED_CACHE"
            cp "$GENERATED_TEAM_LEDGER" data/calibration/team_prop_pregame_ledger.json
            CACHE_DATE=$(python -c "import json; print(json.load(open('data/model_cache/latest.json'))['date'])")
            python scripts/build_parlay_cards.py --date "$CACHE_DATE"
            python scripts/build_profit_desk.py --date "$CACHE_DATE"
            git add data/model_cache data/parlay_cards data/profit_desk data/calibration/team_prop_pregame_ledger.json
            if git diff --cached --quiet; then
              echo "No staged cache change after merge — skipping commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore(models): refresh model cache for ${CACHE_DATE}"
            if git push origin "HEAD:${BRANCH}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying merge on latest origin/${BRANCH}."
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "Unable to publish model cache after retrying latest origin/${BRANCH}."
          exit 1

      - name: Deploy updated model cache
        if: ${{ !cancelled() && !inputs.skip_deploy && steps.commit-cache.outcome == 'success' && steps.commit-cache.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Notify Profit Desk
        # Pushes made with GITHUB_TOKEN never emit push events, so the
        # profit-desk-notify push trigger cannot fire on its own.
        if: steps.commit-cache.outputs.changed == 'true'
        id: notify-profit-desk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run profit-desk-notify.yml --ref main

      - name: Warn if Profit Desk notification dispatch failed
        if: steps.notify-profit-desk.outcome == 'failure'
        run: echo "::warning::Profit Desk notification dispatch failed after cache publication; inspect its log."

      - name: Report model refresh failure after publication
        if: ${{ !cancelled() && steps.refresh-models.outcome == 'failure' }}
        run: |
          echo "::error::Model refresh failed. Any healthy model results were eligible for publication; inspect the refresh and commit steps and the retained artifact."
          exit 1
